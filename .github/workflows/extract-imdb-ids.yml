from pathlib import Path
import re
import sys

catalog = Path("source/addon/catalog/movie/released-movies")
if not catalog.is_dir():
    sys.exit(f"Catalog directory not found: {catalog}")

json_files = sorted(catalog.rglob("*.json"))
if not json_files:
    sys.exit(f"No JSON files found under: {catalog}")

ids = []
seen = set()

for path in json_files:
    text = path.read_text(encoding="utf-8")
    for imdb_id in re.findall(r"\btt\d{7,}\b", text):
        if imdb_id not in seen:
            seen.add(imdb_id)
            ids.append(imdb_id)

Path("imdb_ids.txt").write_text(
    "".join(f"{imdb_id}\n" for imdb_id in ids),
    encoding="utf-8",
)

print(f"Scanned {len(json_files)} JSON files; found {len(ids)} unique IDs.")
