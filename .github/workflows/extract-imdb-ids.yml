name: Export IMDb IDs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-imdb-ids
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v6

      - name: Export IMDb IDs
        run: python3 scripts/export_imdb_ids.py

      - name: Commit updated text file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imdb_ids.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update IMDb IDs"
            git push
          fi
