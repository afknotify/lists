name: Update movie and series IDs

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours, UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch IDs
        run: python3 lists_movies_series.py

      - name: Commit updated ID files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add released-series-ids.txt released-movie-ids.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update released movie and series IDs"
            git push
          fi

      - name: Prepare Pages files
        run: |
          mkdir -p _site
          cp released-series-ids.txt _site/series.txt
          cp released-movie-ids.txt _site/movie.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        
