name: Run github action workflow

on:
  schedule:
      - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install requirements
        run: python -m pip install requests

      - name: Run script
        run: python lists_movies_series.py
